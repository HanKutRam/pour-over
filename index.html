<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour-Over-Protokoll</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5F5F2;--surface:#fff;--ink:#231A16;--muted:#6B625B;--line:#E0DCD6;--accent:#1F6F5C;--accent-ink:#fff;--soft:#E4EFEB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161210;--surface:#211B18;--ink:#F1ECE6;--muted:#A69C93;--line:#383029;--accent:#5FC0A6;--accent-ink:#10201B;--soft:#1F2E29}}
:root[data-theme="dark"]{--bg:#161210;--surface:#211B18;--ink:#F1ECE6;--muted:#A69C93;--line:#383029;--accent:#5FC0A6;--accent-ink:#10201B;--soft:#1F2E29}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.15;margin:0}
main{max-width:920px;margin:0 auto;padding:28px 18px 64px}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:700;letter-spacing:-.02em}
.lead{color:var(--muted);max-width:56ch;margin:8px 0 22px}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 1rem "Instrument Sans",sans-serif;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:1.5rem;margin-bottom:12px}
h3{font-size:1.15rem;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.card.final{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
input,select,textarea{font:400 1rem "Instrument Sans",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
.steps{display:grid;gap:8px;margin:6px 0 10px}
.step{display:grid;grid-template-columns:72px auto 84px auto 1fr;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.step i{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--w),var(--line) var(--w))}
.meta{color:var(--muted);margin:0 0 6px;font-size:.92rem}
.rate{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:8px;margin:6px 0}
.rate div{display:flex;gap:6px}
.rate button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 .95rem "Instrument Sans",sans-serif;cursor:pointer}
.rate button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{font:600 .95rem "Instrument Sans",sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chips button{border-radius:999px;padding:7px 14px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.kit li{font-size:.92rem;color:var(--muted)}.kit b{display:block;color:var(--ink);font-weight:600}
.recipe{background:var(--soft);border-radius:12px;padding:16px;margin-bottom:18px}
.recipe p{margin:2px 0}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
th{font-family:"Bricolage Grotesque",sans-serif;font-weight:700}
.scroll{overflow-x:auto}
.empty{color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:12px}
.list{display:grid;gap:8px}
.reg{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);font:400 1rem "Instrument Sans",sans-serif;cursor:pointer;width:100%}
.reg:hover{border-color:var(--accent)}.reg small{display:block;color:var(--muted)}
.st{font-size:.88rem;color:var(--muted);text-align:right}.st.ok{color:var(--accent);font-weight:600}
.warn{color:#B3261E;font-weight:600;margin:0 0 12px}.warn:empty{display:none}
@media (prefers-color-scheme:dark){.warn{color:#FF8A80}}
:root[data-theme="dark"] .warn{color:#FF8A80}
@media print{nav,.row,.chips,.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<main>
<h1>Pour-Over-Protokoll</h1>
<p class="lead">Vom Stammrezept zum eigenen Rezept für jede Bohne. Ändere pro Versuch nur eine Stellschraube und halte fest, wie die Tasse schmeckt.</p>
<nav role="tablist" id="nav"></nav>
<div id="view"></div>
</main>
<script>
const KEY='pourover-protokoll-v1';
const D={stamm:{dose:17,clicks:14,temp:93,filter:'Kalita',time:'2:30–3:00',steps:[{t:'0:00',g:50},{t:'0:30',g:120},{t:'1:00',g:180},{t:'1:30',g:250}]},beans:[],stammFp:{dose:30,clicks:20,temp:94,water:450,time:'4:00',plan:'Kruste nach 4:00 aufbrechen, Schaum abschöpfen, 5 Minuten ruhen, langsam pressen'},tab:'stamm',open:-1,q:'',f:'all',sort:'name'};
const DIMS=[['sweet','Süße'],['acid','Säure'],['bitter','Bitterkeit'],['body','Körper'],['clarity','Klarheit'],['after','Nachgeschmack'],['overall','Gesamteindruck']];
let S=load(),del=-1;
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign({},D,JSON.parse(r))}catch(e){}return JSON.parse(JSON.stringify(D))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
function setP(p,v){const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v}
const total=o=>o.steps[o.steps.length-1].g;
const wt=o=>o.steps?total(o):o.water;
const calc=o=>`Wasser gesamt ${wt(o)} g, Verhältnis 1:${(wt(o)/(o.dose||1)).toFixed(1).replace('.',',')}`;
const inp=(p,l,v,n)=>`<label>${l}<input data-p="${p}" ${n?'data-n="1" type="number" step="any"':'type="text"'} value="${esc(v)}"></label>`;
const sel=(p,l,v,opts)=>`<label>${l}<select data-p="${p}">${opts.map(o=>`<option${o==v?' selected':''}>${o}</option>`).join('')}</select></label>`;
function params(o,p){
  return `<div class="grid">${inp(p+'.dose','Bohne (g)',o.dose,1)}${inp(p+'.clicks','Mühle (Klicks)',o.clicks,1)}${inp(p+'.temp','Temperatur (°C)',o.temp,1)}${sel(p+'.filter','Filter',o.filter,['Kalita','V60','Abaca'])}${inp(p+'.time','Durchlaufzeit',o.time)}</div>
  <div class="steps" data-o="${p}">${o.steps.map((s,i)=>`<div class="step"><input data-p="${p}.steps.${i}.t" value="${esc(s.t)}" aria-label="Zeit Schritt ${i+1}"><span>bis</span><input data-p="${p}.steps.${i}.g" data-n="1" type="number" value="${s.g}" aria-label="Gramm Schritt ${i+1}"><span>g</span><i style="--w:${Math.min(100,s.g/total(o)*100)}%"></i></div>`).join('')}</div>
  <p class="meta" data-calc="${p}">${calc(o)}</p>`}
const today=()=>new Date().toISOString().slice(0,10);
function newBrew(from){const b=JSON.parse(JSON.stringify(from));return{date:today(),dose:b.dose,clicks:b.clicks,temp:b.temp,filter:b.filter,time:b.time,steps:b.steps,changed:'',r:{},note:''}}
function newFp(from){const b=JSON.parse(JSON.stringify(from));return{date:today(),dose:b.dose,clicks:b.clicks,temp:b.temp,water:b.water,time:b.time,plan:b.plan,changed:'',r:{},note:''}}
const mb=(i,m)=>m=='fp'?S.beans[i].fp:S.beans[i];
const P=(i,m)=>m=='fp'?`beans.${i}.fp`:`beans.${i}`;
function paramsFp(o,p){return `<div class="grid">${inp(p+'.dose','Kaffee (g)',o.dose,1)}${inp(p+'.clicks','Mühle (Klicks)',o.clicks,1)}${inp(p+'.temp','Temperatur (°C)',o.temp,1)}${inp(p+'.water','Wasser (g)',o.water,1)}${inp(p+'.time','Ziehzeit',o.time)}</div><label>Ablauf<textarea data-p="${p}.plan">${esc(o.plan)}</textarea></label><p class="meta" data-calc="${p}" style="margin-top:8px">${calc(o)}</p>`}
function newBean(n,r){return{name:n,roaster:r,origin:'',variety:'',process:'',roast:'',date:'',notes:'',final:null,brews:[newBrew(S.stamm)],fp:{brews:[],final:null}}}
function stamm(){return `<div class="card"><h2>Stammrezept Pour Over</h2><p class="meta">Die Basis für jede neue Bohne. Der erste Schritt ist der Bloom, die Gramm sind Gesamtgewicht auf der Waage.</p>${params(S.stamm,'stamm')}</div>
<div class="card"><h2>Stammrezept French Press</h2><p class="meta">Platzhalterwerte, bitte mit deinem eigenen Rezept überschreiben.</p>${paramsFp(S.stammFp,'stammFp')}</div>
<div class="card"><h3>Mein Setup</h3><ul class="kit"><li><b>Brüher</b>Origami M Air Dripper, French Press</li><li><b>Mühle</b>Timemore C3s Max (S2C-Mahlwerk)</li><li><b>Kessel</b>Fellow Stagg EKG Pro</li><li><b>Waage</b>Timemore Black Mirror Mini</li><li><b>Filter</b>Kalita, V60, Abaca</li><li><b>Wasser</b>BRITA Maxtra PRO Pure Performance</li></ul></div>`}
function recipeCard(b,m){const fp=m=='fp',o=fp?b.fp:b,f=o.brews[o.final];return `<div class="recipe"><h3>Rezeptkarte ${fp?'French Press':'Pour Over'}: ${esc(b.name)}</h3><p>${f.dose} g ${fp?'Kaffee':'Bohne'}, ${f.clicks} Klicks, ${f.temp} °C${fp?'':', Filter '+esc(f.filter)}</p><p>${fp?esc(f.plan):f.steps.map((x,k)=>`${k?'':'Bloom '}${esc(x.t)} auf ${x.g} g`).join(', ')}</p><p>${fp?'Ziehzeit':'Durchlauf'} ${esc(f.time)}. ${calc(f)}</p></div>`}
function rate(p,b){return DIMS.map(([k,n])=>`<div class="rate"><span>${n}</span><div role="group" aria-label="${n}">${[1,2,3,4,5].map(v=>`<button data-r="${p}|${k}|${v}" aria-pressed="${b.r[k]==v}">${v}</button>`).join('')}</div></div>`).join('')}
function brew(b,i,j,fin,m){const p=`${P(i,m)}.brews.${j}`,fp=m=='fp';return `<article class="card ${fin?'final':''}"><h3>Versuch ${j+1} (${fp?'French Press':'Pour Over'}) für <span data-txt="beans.${i}.name">${esc(S.beans[i].name)}</span>${fin?', finales Rezept':''}</h3>
<div class="grid">${inp(p+'.date','Datum',b.date)}<label style="grid-column:span 2">Was wurde gegenüber dem Vorversuch geändert?<input data-p="${p}.changed" value="${esc(b.changed)}" placeholder="z. B. 1 Klick feiner"></label></div>${fp?paramsFp(b,p):params(b,p)}
<h3 style="margin-top:14px">Sensorik (1 bis 5)</h3>${rate(p,b)}<label style="margin-top:10px">Notizen<textarea data-p="${p}.note">${esc(b.note)}</textarea></label>
<div class="row"><button class="btn primary" data-act="final:${i}:${j}:${m}">${fin?'Finales Rezept entfernen':'Als finales Rezept markieren'}</button>${mb(i,m).brews.length>1?`<button class="btn" data-act="delbrew:${i}:${j}:${m}">Versuch löschen</button>`:''}</div></article>`}

const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const dupOf=i=>S.beans.findIndex((x,k)=>k!=i&&norm(x.name)==norm(S.beans[i].name)&&norm(x.roaster)==norm(S.beans[i].roaster));
const last=b=>[b.brews,(b.fp||{brews:[]}).brews].map(a=>a.length?a[a.length-1].date||'':'').sort().pop();
const fin=b=>b.final!=null||(b.fp&&b.fp.final!=null);
const ms=o=>o.brews.length?`${o.brews.length} ${o.brews.length==1?'Versuch':'Versuche'}${o.final!=null?', fertig':''}`:'noch kein Versuch';
const opt=(v,l,c)=>`<option value="${v}"${v==c?' selected':''}>${l}</option>`;
function rows(){
  const q=norm(S.q);
  const L=S.beans.map((b,i)=>({b,i})).filter(({b})=>(S.f=='all'||(S.f=='done')==fin(b))&&norm([b.name,b.roaster,b.origin,b.variety,b.process,b.roast].join(' ')).includes(q));
  L.sort((x,y)=>S.sort=='date'?last(y.b).localeCompare(last(x.b)):norm(x.b.name).localeCompare(norm(y.b.name),'de'));
  if(!L.length)return `<div class="empty">${S.beans.length?'Keine Bohne passt zu Suche und Filter.':'Noch keine Bohne im Register. Lege oben die erste an, sie startet mit deinem Stammrezept.'}</div>`;
  return L.map(({b,i})=>`<button class="reg" data-act="open:${i}"><span><b>${esc(b.name||'Ohne Namen')}</b><small>${esc([b.roaster,b.origin,b.roast].filter(Boolean).join(', '))}</small></span><span class="st ${fin(b)?'ok':''}">Pour Over: ${ms(b)}<br>French Press: ${ms(b.fp)}</span></button>`).join('')}
function register(){return `<div class="card"><h2>Neue Bohne anlegen</h2><div class="grid"><label>Name<input id="nb-n"></label><label>Röster<input id="nb-r"></label></div><div class="row" style="margin-top:0"><button class="btn primary" data-act="addbean">Bohne anlegen</button></div><p class="meta" id="msg" aria-live="polite"></p></div>
<h2>Bohnenregister (${S.beans.length})</h2><div class="grid"><label>Suchen<input id="q" type="search" value="${esc(S.q)}" placeholder="Name, Röster, Herkunft"></label><label>Anzeigen<select data-p="f">${opt('all','Alle',S.f)}${opt('work','In Arbeit',S.f)}${opt('done','Rezept fertig',S.f)}</select></label><label>Sortieren<select data-p="sort">${opt('name','Nach Name',S.sort)}${opt('date','Zuletzt benutzt',S.sort)}</select></label></div><div id="list" class="list">${rows()}</div>`}
function detail(){
  const i=S.open,b=S.beans[i],p=`beans.${i}`,m=S.m=='fp'?'fp':'po',o=mb(i,m),n=k=>mb(i,k).brews.length;
  let h=`<div class="row noprint" style="margin:0 0 14px"><button class="btn" data-act="back">Zurück zum Register</button></div><h2 style="font-size:2rem" data-txt="${p}.name">${esc(b.name)}</h2><p class="meta">Pour Over: ${n('po')} Versuche, French Press: ${n('fp')} Versuche. Beide Methoden werden getrennt dokumentiert.</p><p class="warn" id="dup"></p>
  <div class="card"><h3>Bohnen-Steckbrief</h3><div class="grid">${inp(p+'.name','Name',b.name)}${inp(p+'.roaster','Röster',b.roaster)}${inp(p+'.origin','Herkunft und Höhe',b.origin)}${inp(p+'.variety','Varietät',b.variety)}${inp(p+'.process','Aufbereitung',b.process)}${inp(p+'.roast','Röstgrad',b.roast)}${inp(p+'.date','Röstdatum',b.date)}</div><label>Erwartete Aromen laut Verpackung<input data-p="${p}.notes" value="${esc(b.notes)}"></label>
  <div class="row noprint"><button class="btn" onclick="window.print()">Drucken</button><button class="btn" data-act="delbean:${i}">${del===i?'Wirklich löschen?':'Bohne löschen'}</button></div></div>
  <div class="chips" role="group" aria-label="Methode"><button class="btn" data-act="meth:0:0:po" aria-pressed="${m=='po'}">Pour Over (${n('po')})</button><button class="btn" data-act="meth:0:0:fp" aria-pressed="${m=='fp'}">French Press (${n('fp')})</button></div>`;
  if(!o.brews.length)return h+`<div class="empty">Für diese Bohne gibt es noch keinen Versuch mit ${m=='fp'?'French Press':'Pour Over'}.</div><div class="row"><button class="btn primary" data-act="newbrew:${i}:0:${m}">Ersten Versuch aus dem Stammrezept anlegen</button></div>`;
  if(o.final!=null&&o.brews[o.final])h+=recipeCard(b,m);
  h+=`<h3>Versuchsreihe ${m=='fp'?'French Press':'Pour Over'}</h3><div class="scroll" style="margin-bottom:18px"><table><thead><tr><th>Nr.</th><th>Datum</th><th>Klicks</th><th>°C</th><th>Zeit</th><th>Gesamt</th><th>Änderung</th></tr></thead><tbody>${o.brews.map((x,j)=>`<tr><td>${j+1}${o.final===j?' ✓':''}</td><td>${esc(x.date)}</td><td>${x.clicks}</td><td>${x.temp}</td><td>${esc(x.time)}</td><td>${x.r.overall||'–'}</td><td>${esc(x.changed)}</td></tr>`).join('')}</tbody></table></div>`;
  o.brews.forEach((x,j)=>h+=brew(x,i,j,o.final===j,m));
  return h+`<div class="row"><button class="btn primary" data-act="newbrew:${i}:0:${m}">Neuer Versuch (Kopie des letzten)</button></div>`}
function guide(){
const PO=[['Sauer, dünn, salzig (unterextrahiert)','1 bis 2 Klicks feiner, 1 bis 2 °C heißer, etwas längere Kontaktzeit'],['Bitter, trocken, herb (überextrahiert)','1 bis 2 Klicks gröber, 1 bis 2 °C kühler, sanfter gießen'],['Flach, wenig Süße','Mehr Bohne oder weniger Wasser, Temperatur leicht erhöhen'],['Wässriger Körper','Dosis erhöhen oder Endgewicht senken'],['Durchlauf über 3:00','Gröber mahlen, langsamer und weniger aggressiv gießen, Abaca-Filter testen'],['Durchlauf unter 2:30','Feiner mahlen, gleichmäßiger und langsamer gießen'],['Helle Röstung, fruchtig','Eher 94 bis 96 °C und feiner, um Süße und Säure zu öffnen'],['Dunkle Röstung','Eher 88 bis 91 °C und gröber, damit Bitterkeit im Rahmen bleibt']];
const FP=[['Sauer, dünn, salzig (unterextrahiert)','Ziehzeit um etwa 30 Sekunden verlängern, 1 bis 2 Klicks feiner, 1 bis 2 °C heißer'],['Bitter, trocken, herb (überextrahiert)','Ziehzeit kürzen, gröber mahlen, 1 bis 2 °C kühler, weniger stark umrühren'],['Viel Bodensatz, schlammig','Gröber mahlen, Kruste und Schaum abschöpfen, langsam pressen und nicht ganz bis unten drücken'],['Schwerer, dumpfer Körper, wenig Klarheit','Gröber mahlen, Kruste abschöpfen, Kaffee zusätzlich durch einen Papierfilter oder ein feines Sieb gießen'],['Flach, wenig Süße','Mehr Kaffee oder weniger Wasser, Temperatur leicht erhöhen, Ziehzeit leicht verlängern'],['Zu stark oder zu intensiv','Mehr Wasser (weiteres Verhältnis), Ziehzeit kürzen'],['Pressen geht schwer','Gröber mahlen, etwas weniger Kaffee, langsamer und gerade pressen'],['Wird beim Stehen bitter','Nach dem Pressen sofort in eine Karaffe oder Tasse umgießen, sonst zieht der Kaffee weiter'],['Helle Röstung','Eher 95 bis 96 °C und etwas feiner oder länger ziehen lassen'],['Dunkle Röstung','Eher 90 bis 92 °C und gröber, Ziehzeit eher kürzer']];
const m=S.gm=='fp'?'fp':'po',R=m=='fp'?FP:PO;
return `<h2>Anpassungs-Leitfaden</h2><div class="chips" role="group" aria-label="Methode"><button class="btn" data-act="gm:0:0:po" aria-pressed="${m=='po'}">Pour Over</button><button class="btn" data-act="gm:0:0:fp" aria-pressed="${m=='fp'}">French Press</button></div><p class="meta">Ändere pro Versuch nur eine Variable, sonst weißt du nicht, was gewirkt hat.${m=='fp'?' Bei der French Press gibt es keinen Durchlauf, deshalb ist die Ziehzeit die wichtigste Stellschraube.':''}</p><div class="scroll"><table><thead><tr><th>Problem in der Tasse</th><th>Stellschraube</th></tr></thead><tbody>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`}
const TABS=[['stamm','Stammrezept'],['register','Bohnenregister'],['guide','Leitfaden']];
function render(){
  if(S.tab=='beans')S.tab='register';S.beans.forEach(b=>{if(!b.fp)b.fp={brews:[],final:null}});if(!S.beans[S.open])S.open=-1;
  $n=document.getElementById('nav');$n.innerHTML=TABS.map(([k,n])=>`<button role="tab" data-act="tab:${k}" aria-selected="${S.tab==k}">${n}</button>`).join('');
  document.getElementById('view').innerHTML=S.tab=='stamm'?stamm():S.tab=='register'?(S.open>=0?detail():register()):guide();save()}
function refresh(){
  const d=document.getElementById('dup');if(d){const k=dupOf(S.open);d.textContent=k>=0?'Achtung: Diese Bohne steht schon im Register (gleicher Name und Röster). Bitte nur eine Bohne führen.':''}
  document.querySelectorAll('[data-calc]').forEach(e=>e.textContent=calc(get(e.dataset.calc)));
  document.querySelectorAll('.steps').forEach(s=>{const o=get(s.dataset.o);s.querySelectorAll('i').forEach((el,i)=>el.style.setProperty('--w',Math.min(100,o.steps[i].g/total(o)*100)+'%'))});
  document.querySelectorAll('[data-txt]').forEach(e=>e.textContent=get(e.dataset.txt)||'Ohne Namen')}
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.p)return;setP(t.dataset.p,t.dataset.n?(parseFloat(t.value)||0):t.value);save();if(t.dataset.p=='f'||t.dataset.p=='sort')document.getElementById('list').innerHTML=rows();refresh()});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;document.getElementById('list').innerHTML=rows();save()}});
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-r]');
  if(r){const[p,k,v]=r.dataset.r.split('|'),o=get(p);o.r[k]=o.r[k]==v?0:+v;render();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const[act,x,y,z]=a.dataset.act.split(':'),i=+x,j=+y;
  if(act!='delbean')del=-1;
  if(act=='tab'){S.tab=x;if(x=='register')S.open=-1}
  else if(act=='open')S.open=i;
  else if(act=='back')S.open=-1;
  else if(act=='addbean'){
    const n=document.getElementById('nb-n').value.trim(),ro=document.getElementById('nb-r').value.trim(),m=document.getElementById('msg');
    if(!n){m.textContent='Bitte gib einen Namen ein.';return}
    const k=S.beans.findIndex(b=>norm(b.name)==norm(n)&&norm(b.roaster)==norm(ro));
    if(k>=0){m.innerHTML=`Diese Bohne gibt es schon: ${esc(S.beans[k].name)}. <button class="btn" data-act="open:${k}">Vorhandene Bohne öffnen</button>`;return}
    S.beans.push(newBean(n,ro));S.open=S.beans.length-1}
  else if(act=='gm')S.gm=z;
  else if(act=='meth')S.m=z;
  else if(act=='newbrew'){const bs=mb(i,z).brews,fp=z=='fp';bs.push(fp?newFp(bs.length?bs[bs.length-1]:S.stammFp):newBrew(bs.length?bs[bs.length-1]:S.stamm))}
  else if(act=='final'){const b=mb(i,z);b.final=b.final===j?null:j}
  else if(act=='delbrew'){const b=mb(i,z);b.brews.splice(j,1);b.final=b.final===j?null:(b.final>j?b.final-1:b.final)}
  else if(act=='delbean'){if(del===i){S.beans.splice(i,1);S.open=-1;del=-1}else del=i}
  render()});
render();
</script>
</body>
</html>
